[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pruebas deterministas sin red",
    "integration: pruebas contra BDFutbol/Transfermarkt reales",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "Varios",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src/football_dataset/persistence.py",
    "src/football_dataset/audit.py",
]
exclude = ["(^|/)tests?(/|$)"]
ignore_missing_imports = true
warn_unused_configs = true
allow_redefinition = true

# El chequeo estricto se introduce progresivamente. El núcleo de persistencia
# es el primer módulo obligatorio; el resto del código histórico se incorpora
# por módulos conforme se anoten sus APIs públicas.
